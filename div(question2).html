<!DOCTYPE html>
<html lang="en">
<head>
  <title>Center a div</title>
  <style>
body{
  margin: 0;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;     
  background-color: white;
}
div{
  background-color: silver;
  padding: 40px;
  border-radius: 10px;
  box-shadow: white;
  text-align: center;

}
h1{
  font-family: 'Arial', sans-serif;
}
  </style>
</head>
<body>
  <div class="center-box">
    <h1>MREM College</h1>
  </div>
</body>
</html>
