<!DOCTYPE html>
<html>
<head>
    <title>Navigation Bar</title>
    <style>
        .navbar {
            background-color: rgb(3, 39, 69);
            overflow: hidden;
        }
        .navbar a {
            float: right;
            display: block;
            color: white;
            text-align: center;
            padding: 14px 16px;
            text-decoration: underline;
        }
        .navbar a:hover {
            background-color: #ddd;
            color: black;
        }
    </style>
</head>
<body>
    <div class="navbar">
        <a href="#home">Home</a>
        <a href="#about">About</a>
        <a href="#contact">Contact</a>
        <a href="#student login">student login</a>
        <a href="#Staff login">Staff login</a>
    </div>
</body>
</html>
