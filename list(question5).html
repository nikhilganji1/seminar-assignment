<!DOCTYPE html>
<html>
<head>
    <title>Horizontal List</title>
    <style>
        ul {
            display: flex;
            border-radius: 5px;
            border: 5px solid #ccc;
            background-color: #ccc;
            list-style-type: none;
        }
        li {
            margin-right: 20px;
            padding: 10px;
            border-radius: 5px;
            font-family: Helvetica, sans-serif;
            font-weight: bold;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <ul>
        <li>Home</li>
        <lI>About</lI>
        <li>sign-in</li>
        <li>sign-out</li>
        <li>Help</li>
    </ul>
</body>
</html>
